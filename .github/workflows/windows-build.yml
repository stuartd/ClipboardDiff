name: Windows build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG

          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$')
          {
            throw "Release tags must look like v1.2.3 or v1.2.3-preview.1; got '$tag'."
          }

          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/create-local-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload self-contained Windows build
        uses: actions/upload-artifact@v7
        with:
          name: ClipDiff-win-x64-self-contained
          path: releases/ClipDiff-*-win-x64-self-contained/
          if-no-files-found: error
          retention-days: 14

      - name: Upload .NET 10 Windows build
        uses: actions/upload-artifact@v7
        with:
          name: ClipDiff-win-x64-net10
          path: releases/ClipDiff-*-win-x64-net10/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $selfContained = "releases/ClipDiff-$env:RELEASE_VERSION-win-x64-self-contained.zip"
          $net10 = "releases/ClipDiff-$env:RELEASE_VERSION-win-x64-net10.zip"

          gh release create $env:RELEASE_TAG $selfContained $net10 --verify-tag --generate-notes --title "ClipDiff $env:RELEASE_TAG"
